apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cert-manager
      version: "v1.20.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  interval: 1h0m0s
  targetNamespace: lab-cert-manager
  # Without this, Flux composes the Helm release name as
  # <targetNamespace>-<name> ("lab-cert-manager-cert-manager"), which then
  # flows into every object name the chart generates. Pinning it keeps
  # object names predictable for anything that references them later.
  releaseName: cert-manager
  install:
    createNamespace: true
  values:
    crds:
      enabled: true
    # Lab-scale requests. Defaults leave `resources: {}` (nothing reserved),
    # which under-represents real usage in `kubectl describe nodes` - set
    # small explicit requests instead so the budget is honest.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
