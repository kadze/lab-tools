---
# Root Kustomization: reconciles everything under ./gitops. No
# kustomization.yaml exists at gitops/ itself - Flux auto-generates one by
# scanning subdirectories recursively (same pattern the team's gitops-flux
# repo uses), so a new component directory is picked up without editing an
# index file.
#
# prune: true is what makes `kubectl delete -f bootstrap/` a real teardown:
# deleting these two objects removes every object Flux created from them.
#
# No healthChecks currently needed: nothing under ./gitops has a downstream
# consumer in ./gitops-issuers waiting on its Helm install to actually
# finish (not just the HelmRelease object existing) - that was cert-manager
# before it moved to the team's own install (gitops-flux#14). Re-add a
# healthCheck entry here if a future component in gitops-issuers/ needs the
# same ordering guarantee.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lab-tools
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./gitops
  prune: true
  sourceRef:
    kind: GitRepository
    name: lab-tools
  wait: true
  timeout: 5m0s
