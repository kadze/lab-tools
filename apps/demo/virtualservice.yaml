# Exercise 3, step 1 of 2: 5s delay, injected on 100% of matched requests -
# but only requests carrying the x-fault-test header are matched at all.
# Unmatched (normal) traffic falls through to the second http entry and is
# completely unaffected. This mirrors Istio's own bookinfo tutorial
# pattern: fault injection scoped to a specific test signal, not a blanket
# break-everything change - the whole point is proving you can validate
# failure handling without degrading real traffic.
#
# Test with:
#   fortio curl -H "x-fault-test: true" ... -> ~5s response
#   fortio curl ...                          -> normal, fast response
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: helloworld
  namespace: lab-demo
spec:
  hosts:
    - helloworld.lab-demo.svc.cluster.local
  http:
    - match:
        - headers:
            x-fault-test:
              exact: "true"
      fault:
        delay:
          percentage:
            value: 100
          fixedDelay: 5s
      route:
        - destination:
            host: helloworld.lab-demo.svc.cluster.local
            subset: v2
    - route:
        - destination:
            host: helloworld.lab-demo.svc.cluster.local
            subset: v2
