# Exercise 2, step 3 of 3: full cutover to v2. Step 2 (50/50) confirmed via
# 100 real requests: 54/46, matching the configured weight closely.
#
# Single destination, not two entries at 0/100 - this is what a completed
# migration actually looks like once v1 is fully retired, not a canary
# still holding a rollback path open. v1's Deployment is untouched and
# still running (2/2 pods) - nothing routes to it anymore, but it is one
# VirtualService edit away from getting traffic again if this needed to be
# reverted.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: helloworld
  namespace: lab-demo
spec:
  hosts:
    - helloworld.lab-demo.svc.cluster.local
  http:
    - route:
        - destination:
            host: helloworld.lab-demo.svc.cluster.local
            subset: v2
