# Exercise 4, step 1 of 2: timeout below the injected delay. Back to the
# 5s/100% delay fault from exercise 3 step 1 (confirmed then: normal
# 0.783s, headered 5.670s) - now with an Istio-level timeout: 2s added.
#
# This is a different failure than before: previously the client (fortio)
# had to wait out its own timeout, or wait the full 5s. Now Envoy itself
# aborts the request at 2s with a 504, regardless of client patience -
# same mechanism a real caller would rely on to fail fast against a slow
# dependency rather than hang indefinitely.
#
# timeout applies to BOTH routes deliberately - a real timeout policy
# protects every call to a dependency, not just the ones under test. It
# has no effect on the normal (unmatched) route since nothing there is
# ever slow enough to trigger it.
#
# Test with:
#   fortio curl -H "x-fault-test: true" ... -> 504 at ~2s, not ~5s
#   fortio curl ...                          -> normal, fast response
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: helloworld
  namespace: lab-demo
spec:
  hosts:
    - helloworld.lab-demo.svc.cluster.local
  http:
    - match:
        - headers:
            x-fault-test:
              exact: "true"
      fault:
        delay:
          percentage:
            value: 100
          fixedDelay: 5s
      timeout: 2s
      route:
        - destination:
            host: helloworld.lab-demo.svc.cluster.local
            subset: v2
    - timeout: 2s
      route:
        - destination:
            host: helloworld.lab-demo.svc.cluster.local
            subset: v2
