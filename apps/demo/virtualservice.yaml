# Exercise 3, step 2 of 2: 500 abort on 50% of matched requests. Step 1
# (5s delay, 100% of matched requests) confirmed with a direct timed test:
# normal request 0.783s, headered request 5.670s - matches the configured
# delay almost exactly.
#
# 50%, not 100%, deliberately - proves the percentage knob itself works:
# repeated headered requests should show a real, visible mix of 200s and
# 500s, not an all-or-nothing switch. Unmatched (normal) traffic still
# falls through to the second http entry, completely unaffected.
#
# Test with (repeat several times - each is independently ~50/50):
#   fortio curl -H "x-fault-test: true" ... -> ~50% chance of HTTP 500
#   fortio curl ...                          -> always 200, unaffected
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: helloworld
  namespace: lab-demo
spec:
  hosts:
    - helloworld.lab-demo.svc.cluster.local
  http:
    - match:
        - headers:
            x-fault-test:
              exact: "true"
      fault:
        abort:
          percentage:
            value: 50
          httpStatus: 500
      route:
        - destination:
            host: helloworld.lab-demo.svc.cluster.local
            subset: v2
    - route:
        - destination:
            host: helloworld.lab-demo.svc.cluster.local
            subset: v2
