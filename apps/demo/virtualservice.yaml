# Exercise 2, step 2 of 3: 50/50. Step 1 (90/10) confirmed via 100 real
# requests: 92/8, matching the configured weight closely.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: helloworld
  namespace: lab-demo
spec:
  hosts:
    - helloworld.lab-demo.svc.cluster.local
  http:
    - route:
        - destination:
            host: helloworld.lab-demo.svc.cluster.local
            subset: v1
          weight: 50
        - destination:
            host: helloworld.lab-demo.svc.cluster.local
            subset: v2
          weight: 50
