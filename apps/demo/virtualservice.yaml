# Exercise 4, step 1 (recorded finding, not the working demo): tried a 2s
# timeout against the 5s fault.delay from exercise 3, expecting Envoy to
# cut the request off at 2s with a 504. It didn't - the headered request
# still completed successfully at 5.756s.
#
# Confirmed via Envoy's own route config (fortio's sidecar, :15000/config_dump),
# not guessed: both `"timeout": "2s"` and the 5s fault delay were genuinely
# present and correctly configured. The reason is filter ordering, not
# misconfiguration: Envoy's HTTP Fault filter runs BEFORE the Router filter
# in the chain, and fault.delay is injected there - the route `timeout`
# only starts counting once the Router filter begins forwarding upstream,
# which happens *after* the fault delay already completed. By the time the
# timeout clock starts, the real upstream call is fast (~100ms), so the 2s
# limit never sees anything to catch. Total time = 5s delay + ~100ms real
# response + overhead, not 2s.
#
# Real lesson: a route timeout does not bound a fault-injected (or any
# proxy-side) delay that happens ahead of the Router filter - it only
# bounds the upstream call itself. This is a genuine, documented Envoy
# behavior, not something to work around here.
#
# Exercise 4, step 2 of 2: retries against the abort fault instead - that
# doesn't have this problem, since an abort is an instant response, not a
# delay competing with the timeout clock. attempts: 3 means up to 4 total
# tries (1 initial + 3 retries); against a 50% abort, all 4 failing
# independently is 0.5^4 = 6.25%, so success rate should jump from ~50% to
# ~94%.
#
# Test with (repeat several times):
#   fortio curl -H "x-fault-test: true" ... -> ~94% success now, not ~50%
#   fortio curl ...                          -> always 200, unaffected
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: helloworld
  namespace: lab-demo
spec:
  hosts:
    - helloworld.lab-demo.svc.cluster.local
  http:
    - match:
        - headers:
            x-fault-test:
              exact: "true"
      fault:
        abort:
          percentage:
            value: 50
          httpStatus: 500
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx
      route:
        - destination:
            host: helloworld.lab-demo.svc.cluster.local
            subset: v2
    - route:
        - destination:
            host: helloworld.lab-demo.svc.cluster.local
            subset: v2
