apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld-v1
  namespace: lab-demo
  labels:
    app: helloworld
    version: v1
spec:
  # 2 replicas per version (4 pods total across v1+v2) - deliberately more
  # than the minimum, so there's something for #27's topology-aware
  # routing to actually do once these land across both us-east-1a and
  # us-east-1b, and something for the load-test exercise to spread across.
  replicas: 2
  selector:
    matchLabels:
      app: helloworld
      version: v1
  template:
    metadata:
      labels:
        app: helloworld
        version: v1
    spec:
      containers:
        - name: helloworld
          image: docker.io/istio/examples-helloworld-v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          ports:
            - containerPort: 5000
